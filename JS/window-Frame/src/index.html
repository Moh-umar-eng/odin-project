<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal Popups</title>
</head>
<body>
    
    <!-- Trigger button -->
    <button id="openModalBtn" type="button">Edit Profile</button>

    <!-- Modal dialog -->
    <dialog id="profileModal" aria-labelledby="modalTitle" aria-describedby="modalDesc">
        <div class="dialog-content">
            <header>
                <h2 id="modalTitle">Edit Profile</h2>
                <button id="closeModalBtn" type="button" aria-label="Close dialog">&times;</button>
            </header>

            <p id="modalDesc">Update your account username and email below.</p>

            <!-- Native dialog form: submitting this closes the dialog automatically -->
            <form method="dialog" id="profileForm">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>

                <div class="actions">
                    <button type="button" id="cancelBtn">Cancel</button>
                    <button type="submit" value="confirm" class="primary">Save Changes</button>
                </div>
            </form>
        </div>
    </dialog>


</body>
</html>
